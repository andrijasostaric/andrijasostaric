    <text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Clarity → Ownership</text>
    <text x="24" y="101" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">→ Decisions → Results</text>
