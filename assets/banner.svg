<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Andrija Sostaric — Project, Programme and Operations Manager</title>
  <desc id="desc">Professional portfolio banner highlighting PMO, operational excellence, GRC, financial services and technology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D2748"/>
      <stop offset="100%" stop-color="#172F55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2341"/>
      <stop offset="100%" stop-color="#B04B68"/>
