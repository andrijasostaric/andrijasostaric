  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1090" cy="30" r="180" fill="#ffffff" opacity="0.035"/>
  <circle cx="1030" cy="280" r="120" fill="#ffffff" opacity="0.025"/>
  <rect x="72" y="58" width="88" height="8" rx="4" fill="url(#accent)"/>
  <text x="72" y="125" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Andrija Sostaric</text>
  <text x="72" y="171" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#DCE6F3">Project · Programme · Operations</text>
  <text x="72" y="211" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#BFCDE0">PMO  •  Operational Excellence  •  GRC  •  Financial Services  •  Technology</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">
    <rect x="72" y="246" width="174" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="159" y="272" text-anchor="middle" fill="#ffffff">Remote delivery</text>
    <rect x="262" y="246" width="194" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="359" y="272" text-anchor="middle" fill="#ffffff">Cross-functional</text>
    <rect x="472" y="246" width="186" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
